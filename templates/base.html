<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FTBI Academic Portal</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#18243b;font:16px system-ui,sans-serif}header{background:#142844;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}header a{color:white}main{max-width:1050px;margin:40px auto;padding:0 20px}a{color:#145b9e}section,article{background:white;border:1px solid #dce2ea;border-radius:12px;padding:22px;margin:15px 0}button{background:#185a91;color:white;border:0;border-radius:6px;padding:10px 18px;cursor:pointer}input,textarea{display:block;max-width:100%;padding:9px;border:1px solid #8995a5;border-radius:5px}nav{display:flex;gap:16px;align-items:center}small{color:#58677a}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.cards article{margin:0}h1{font-size:2rem}pre{white-space:pre-wrap;font:inherit}a:focus-visible,button:focus-visible{outline:3px solid #e5a837}
</style></head><body><header><strong>FTBI | Academic Portal</strong>{% if user.is_authenticated %}<nav><a href="{% url 'dashboard' %}">Dashboard</a>{% if user.is_staff %}<a href="{% url 'admin:index' %}">Administration</a>{% endif %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Sign out</button></form></nav>{% endif %}</header><main>{% block content %}{% endblock %}</main></body></html>
