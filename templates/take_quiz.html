{% extends "base.html" %}{% block content %}<h1>{{ quiz.title }}</h1>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}{% for q in questions %}<fieldset><legend>{{ q.prompt }}</legend><label><input type="radio" name="q{{ q.pk }}" value="A" required>{{ q.option_a }}</label><label><input type="radio" name="q{{ q.pk }}" value="B">{{ q.option_b }}</label><label><input type="radio" name="q{{ q.pk }}" value="C">{{ q.option_c }}</label><label><input type="radio" name="q{{ q.pk }}" value="D">{{ q.option_d }}</label></fieldset>{% endfor %}<button>Submit quiz</button></form>{% endblock %}
