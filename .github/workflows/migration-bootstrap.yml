name: One-time FTBI migration bootstrap
on:
  push:
    branches: [ftbi-release-hardening]
permissions:
  contents: write
jobs:
  generate:
    if: github.ref == 'refs/heads/ftbi-release-hardening'
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate and validate schema
        run: |
          python manage.py makemigrations academics
          python manage.py migrate
          python manage.py makemigrations --check --dry-run
          python manage.py test
      - name: Commit validated initial migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add academics/migrations/*.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Commit validated initial academic schema"
          git push origin HEAD:ftbi-release-hardening
