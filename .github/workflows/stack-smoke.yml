name: Production stack smoke
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SECRET_KEY: ci-only-disposable-stack-key-never-use-in-production-583240923
      POSTGRES_PASSWORD: ci-only-disposable-db-password
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      FTBI_DOMAIN: localhost
      FTBI_MONITOR_TOKEN: synthetic-ci-monitor-token-never-use-in-production
      FTBI_CLAMAV_HOST: scanner
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.production.yaml build web
      - run: docker compose -f compose.production.yaml up -d --wait db cache
      - run: docker compose -f compose.production.yaml --profile scanner up -d scanner
      - run: docker compose -f compose.production.yaml run --rm web python manage.py migrate --noinput
      - run: docker compose -f compose.production.yaml up -d --wait --wait-timeout 180 web
      - name: Verify production database, Redis and HTTP readiness
        run: docker compose -f compose.production.yaml exec -T web python scripts/stack_probe.py
      - name: Verify real antivirus and fail-closed behavior
        run: docker compose -f compose.production.yaml exec -T web python scripts/scanner_probe.py
      - name: Exercise PostgreSQL dump and disposable restore
        run: |
          docker compose -f compose.production.yaml exec -T db pg_dump -U ftbi -Fc ftbi > /tmp/ftbi-ci.dump
          docker compose -f compose.production.yaml exec -T db createdb -U ftbi ftbi_restore_test_ci
          docker compose -f compose.production.yaml exec -T db pg_restore -U ftbi --exit-on-error -d ftbi_restore_test_ci < /tmp/ftbi-ci.dump
          docker compose -f compose.production.yaml exec -T db psql -U ftbi -d ftbi_restore_test_ci -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM django_migrations;"
      - name: Capture container logs
        if: always()
        run: docker compose -f compose.production.yaml logs --no-color > stack-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-smoke
          path: stack-smoke.log
      - name: Remove disposable CI services and volumes
        if: always()
        run: docker compose -f compose.production.yaml down -v

  smtp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_DEBUG: '1'
      FTBI_SMTP_TESTING: '1'
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      SMTP_USER: smtp-fixture
      SMTP_PASSWORD: synthetic-smtp-password
      SMTP_FROM: portal@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Start isolated STARTTLS capture server
        run: |
          mkdir -p "$RUNNER_TEMP/ftbi-smtp"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' -keyout "$RUNNER_TEMP/ftbi-smtp/key.pem" -out "$RUNNER_TEMP/ftbi-smtp/cert.pem" 2>/dev/null
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=untrusted.invalid -keyout "$RUNNER_TEMP/ftbi-smtp/untrusted-key.pem" -out "$RUNNER_TEMP/ftbi-smtp/untrusted-cert.pem" 2>/dev/null
          docker run -d --name ftbi-smtp-probe -p 127.0.0.1:1025:1025 -p 127.0.0.1:8025:8025 -v "$RUNNER_TEMP/ftbi-smtp:/tls:ro" -e MP_SMTP_TLS_CERT=/tls/cert.pem -e MP_SMTP_TLS_KEY=/tls/key.pem -e MP_SMTP_REQUIRE_STARTTLS=true -e MP_SMTP_AUTH=smtp-fixture:synthetic-smtp-password -e MP_DISABLE_VERSION_CHECK=true -e MP_MAX_MESSAGES=20 axllent/mailpit:v1.34.0
      - run: python manage.py migrate --noinput
      - name: Verify actual delivery and failure handling
        run: |
          export SSL_CERT_FILE="$RUNNER_TEMP/ftbi-smtp/cert.pem"
          export FTBI_SMTP_UNTRUSTED_CA="$RUNNER_TEMP/ftbi-smtp/untrusted-cert.pem"
          python scripts/smtp_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smtp-validation
          path: smtp-validation.json
      - name: Remove disposable mail capture
        if: always()
        run: docker rm -f ftbi-smtp-probe
