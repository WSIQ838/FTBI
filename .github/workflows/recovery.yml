name: Encrypted recovery drill
on: [push, pull_request]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ftbi
          POSTGRES_USER: ftbi
          POSTGRES_PASSWORD: disposable-recovery-test-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ftbi" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: '1'
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: ftbi
      POSTGRES_USER: ftbi
      POSTGRES_PASSWORD: disposable-recovery-test-password
      PGHOST: 127.0.0.1
      PGDATABASE: ftbi
      PGUSER: ftbi
      PGPASSWORD: disposable-recovery-test-password
      FTBI_ALLOW_DEMO: '1'
      FTBI_DEMO_PASSWORD: disposable-synthetic-demo-password
      FTBI_RESTORE_TEST_DB: ftbi_restore_test_encrypted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y age postgresql-client-16
      - run: python manage.py migrate && python manage.py seed_demo
      - name: Encrypt, restore and compare every application model
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          export BACKUP_DIR="$RUNNER_TEMP/encrypted-backups"
          export BACKUP_AGE_IDENTITY_FILE="$RUNNER_TEMP/disposable-age-key"
          age-keygen -o "$BACKUP_AGE_IDENTITY_FILE"
          export BACKUP_AGE_RECIPIENT="$(age-keygen -y "$BACKUP_AGE_IDENTITY_FILE")"
          python scripts/database_fingerprint.py > "$RUNNER_TEMP/before.txt"
          python scripts/backup_catalog.py init "$BACKUP_DIR"
          python scripts/backup_catalog.py run "$BACKUP_DIR"
          createdb "$FTBI_RESTORE_TEST_DB"
          sh scripts/restore-encrypted-check.sh "$BACKUP_DIR"/*.dump.age
          POSTGRES_DB="$FTBI_RESTORE_TEST_DB" python scripts/database_fingerprint.py > "$RUNNER_TEMP/after.txt"
          diff "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt"
          POSTGRES_DB="$FTBI_RESTORE_TEST_DB" python manage.py migrate --check
          for archive in "$BACKUP_DIR"/*.dump.age; do python scripts/backup_catalog.py mark-restored "$BACKUP_DIR" --archive "$(basename "$archive")"; done
          python scripts/backup_catalog.py prune "$BACKUP_DIR"
          cat "$RUNNER_TEMP/after.txt"
          echo "Encrypted synthetic-data restore and exact application-row comparison passed." > recovery-result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-result
          path: recovery-result.txt
