name: Browser and accessibility validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_DEBUG: '1'
      FTBI_BROWSER_TESTING: '1'
      FTBI_ALLOW_DEMO: '1'
      FTBI_DEMO_PASSWORD: synthetic-browser-test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --settings=ftbi.browser_settings
      - run: python manage.py seed_demo --settings=ftbi.browser_settings
      - run: npm ci
        working-directory: browser-tests
      - run: npx playwright install --with-deps
        working-directory: browser-tests
      - run: npm test
        working-directory: browser-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            browser-tests/playwright-report/
            browser-tests/test-results/
